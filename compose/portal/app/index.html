<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Portal</title>
<style>
body {
  background:#0d1117;
  color:#f0f6fc;
  font-family:Arial,sans-serif;
  margin:40px;
}
a {
  display:inline-block;
  margin:10px;
  padding:12px 18px;
  background:#238636;
  color:white;
  text-decoration:none;
  border-radius:8px;
}
</style>
</head>
<body>

<h1>🚀 Atlas Portal</h1>

<p>Infrastructure Platform v1.6.0</p>

<h2>🟢 System Healthy</h2>

<p id="uptime">Loading...</p>

<p id="disk">Loading...</p>

<p id="memory">Loading...</p>

<p id="cpu">Loading...</p>

<a href="https://grafana.atlasconnect.ca">📊 Monitoring</a>

<script>
fetch('/api/stats')
  .then(r => r.json())
  .then(data => {
    document.getElementById('uptime').textContent =
      'Uptime: ' + data.uptime;

    document.getElementById('disk').textContent =
      'Disk Usage: ' + data.disk_used_percent + '%';

document.getElementById('memory').textContent =
  'Memory Usage: ' + data.memory_percent + '%';

document.getElementById('cpu').textContent =
  'CPU Usage: ' + data.cpu_percent + '%';
  });
</script>

</body>
</html>
