services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: atlas-vpn
    restart: unless-stopped

    environment:
      - LANG=en
      - WG_HOST=vpn.atlasconnect.ca
      - PASSWORD - PASSWORD_HASH=$$2a$$12$$5VvwqG3jaPjPgueZoU0tOOrw3IhYobjSKyk7Q30ClasEk/lgI5Xd.

    volumes:
      - /opt/atlas/data/wg-easy:/etc/wireguard

    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    sysctls:
      - net.ipv4.ip_forward=1

networks:
  default:
    external: true
    name: atlas-network
